name: Shadow baseline and portable laws

on:
  pull_request:

permissions:
  contents: read

jobs:
  shadow-baseline:
    name: Shadow baseline (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        revision: [reference, candidate]
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'reference' && '07085d6557b75834ce6f50e6c54b8ca47e1c7c08' || github.event.pull_request.head.sha }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the root application
        run: pnpm build
      - name: Test cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @open-hax/openplanner-store-cache test
      - name: Test document hydration
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @open-hax/openplanner-document-hydration test
      - name: Test graph claims
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @open-hax/openplanner-graph-claim-core test
      - name: Test translation core
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @open-hax/openplanner-translation-core test

  portable-schema-laws:
    name: Portable schema structural laws (nbb and JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run portable assertions on nbb
        run: pnpm test:contract:portable-schema-laws
      - name: Run the same portable assertions on JVM Clojure
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          pnpm exec shadow-cljs clj-run openplanner.schema-laws-test/-main
