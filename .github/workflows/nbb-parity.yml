name: Nbb parity checkpoint

on:
  pull_request:

permissions:
  contents: read

jobs:
  nbb-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build reference SDK used by route imports
        run: pnpm --filter @open-hax/openplanner-sdk build
      - name: Verify HTTP reference and nbb contracts
        run: |
          pnpm test:contract:openapi
          pnpm test:contract:openapi:nbb
          pnpm test:contract:blobs
          pnpm test:contract:blobs:nbb
          pnpm test:contract:blobs:edges
          pnpm test:contract:blobs:edges:nbb
          pnpm test:contract:auth
          pnpm test:contract:auth:nbb
          pnpm test:contract:backend-slice
          pnpm test:contract:backend-slice:nbb
          pnpm test:contract:schemas
          pnpm test:contract:schemas:nbb
      - name: Verify nbb package and boundary contracts
        run: |
          pnpm test:contract:closure-sha:nbb
          pnpm test:diagnostic:closure-object
          pnpm test:contract:closure-object:intrinsics
          pnpm test:nbb:cache
          pnpm test:nbb:document-hydration
          pnpm test:contract:cache-exports
          pnpm test:contract:cache-exports:nbb
          pnpm test:contract:hydration-exports
          pnpm test:contract:hydration-exports:nbb
      - name: Verify focused existing tests
        run: node --import tsx --test src/tests/embedding-models.test.ts src/tests/sentence-split.test.ts

  openapi-malli-reference:
    name: Reference-first OpenAPI Malli laws (nbb)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      # Official Babashka recommends setup-clojure; this native bb version
      # resolves dependencies without a JVM, but first fetch still needs Maven.
      - name: Set up native Babashka
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          bb: 1.13.222
      - name: Install locked npm dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build reference SDK used by route imports
        run: pnpm --filter @open-hax/openplanner-sdk build
      - name: Check original HTTP document against Malli laws first
        working-directory: test/malli
        run: >-
          node --import tsx ../../node_modules/nbb/cli.js
          --classpath ../../src/cljs:../cljs
          -m openplanner.contract.openapi-laws-http-contract
      - name: Run shared Malli laws and macro on nbb
        working-directory: test/malli
        run: >-
          node ../../node_modules/nbb/cli.js
          --classpath ../../src/cljs:../cljs
          -m openplanner.law.openapi-test
      - name: Check nbb candidate HTTP document against the same Malli laws
        working-directory: test/malli
        env:
          OPENPLANNER_OPENAPI_MODULE: src/cljs/openplanner/extern/js/http/openapi.cljs
        run: >-
          node --import tsx ../../node_modules/nbb/cli.js
          --classpath ../../src/cljs:../cljs
          -m openplanner.contract.openapi-laws-http-contract
